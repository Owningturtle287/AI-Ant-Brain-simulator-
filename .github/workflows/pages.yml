name: Deploy Fire Ant Lab
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium --with-deps
      - run: npm run test:browser
      - uses: actions/upload-artifact@v6
        with:
          name: browser-screenshots
          path: browser-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish simulator
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Add phone install link
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          printf '%s\n' "### [Open Fire Ant Lab](${PAGE_URL})" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' 'Open the link on your phone and use your browser’s home-screen install option.' >> "$GITHUB_STEP_SUMMARY"
